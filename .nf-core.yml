repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    # MIT-0 (MIT No Attribution), as the other OAMD pipelines: this is a U.S. Government work. The
    # template's LICENSE is MIT with a copyright line, which ph-core does not allow.
    - LICENSE
    - CODE_OF_CONDUCT.md
    - assets/nf-core-oamd-bio-qqq_logo_light.png
    - docs/images/nf-core-oamd-bio-qqq_logo_light.png
    - docs/images/nf-core-oamd-bio-qqq_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/config.yml
    - docs/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    # Adds .nf-test*, which the template does not carry: nf-test writes its
    # work directory and log into the repository root.
    - .gitignore
    - assets/email_template.txt
    # Diverges deliberately: this pipeline ships no logo PNG, so the template's
    # unconditional read of one raised FileNotFoundException whenever --email was
    # used. The image part is now emitted only when the file exists.
    - assets/sendmail_template.txt
    # Calls the shared cdcent/oamd-bio-gh-actions lint workflow, as the other
    # OAMD pipelines do, in place of the template's self-contained job.
    - .github/workflows/linting.yml
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    # This pipeline uses no reference genomes, so the iGenomes machinery was
    # removed. Its schema validation also stat-ed s3://ngi-igenomes/, which the
    # AMDP credentials cannot read, blocking every run.
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CODE_OF_CONDUCT.md
    - assets/nf-core-oamd-bio-qqq_logo_light.png
    - docs/images/nf-core-oamd-bio-qqq_logo_light.png
    - docs/images/nf-core-oamd-bio-qqq_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    # CI runs through the shared cdcent/oamd-bio-gh-actions workflows, which
    # replace the template's nf-test composite actions and its branch.yml, as in
    # the other OAMD pipelines. pr-comment.yml only posted for those jobs; do not
    # take it back from a template sync without review, since the upstream
    # poster lets a fork PR aim its write token at any PR in the repository.
    - .github/workflows/branch.yml
    - .github/workflows/pr-comment.yml
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    # Template files of nf-core/tools 3.x, checked only when linting with 3.x.
    - .github/CONTRIBUTING.md
    - .github/workflows/linting_comment.yml

template:
  org: cdcent
  name: qqq
  description: OAMD bioinformatics pipeline qqq
  author: OAMD Bioinformatics
  version: 1.0.0dev
  force: false
  outdir: .
  is_nfcore: false
