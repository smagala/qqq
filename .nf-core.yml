repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-oamd-bio-qqq_logo_light.png
    - docs/images/nf-core-oamd-bio-qqq_logo_light.png
    - docs/images/nf-core-oamd-bio-qqq_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/config.yml
    - docs/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    # Adds .nf-test*, which the template does not carry: nf-test writes its
    # work directory and log into the repository root.
    - .gitignore
    - assets/email_template.txt
    # Diverges deliberately: this pipeline ships no logo PNG, so the template's
    # unconditional read of one raised FileNotFoundException whenever --email was
    # used. The image part is now emitted only when the file exists.
    - assets/sendmail_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    # This pipeline uses no reference genomes, so the iGenomes machinery was
    # removed. Its schema validation also stat-ed s3://ngi-igenomes/, which the
    # AMDP credentials cannot read, blocking every run.
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CODE_OF_CONDUCT.md
    - assets/nf-core-oamd-bio-qqq_logo_light.png
    - docs/images/nf-core-oamd-bio-qqq_logo_light.png
    - docs/images/nf-core-oamd-bio-qqq_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: cdcent
  name: qqq
  description: OAMD bioinformatics pipeline qqq
  author: OAMD Bioinformatics
  version: 1.0.0dev
  force: false
  outdir: .
  is_nfcore: false
