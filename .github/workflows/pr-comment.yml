name: Post PR comment
# Shared, privileged comment poster.
#
# This is the single workflow that runs with a write token. It is triggered
# after any of the listed "producer" workflows complete on a pull request.
# Each producer runs untrusted PR code (if any) with a read-only token and
# uploads a `pr-comment` artifact describing the comment to post; this workflow
# only ever reads that plain-text artifact, so no PR code is executed here.
#
# Artifact contract (uploaded by producers under the name `pr-comment`):
#   pr_number.txt  - the pull request number (cross-checked, NOT trusted; see below)
#   header.txt     - sticky-comment identifier (keeps comment types separate)
#   comment.md     - the Markdown body (omit the file to post nothing)
#
# The artifact is written by a run that executed untrusted pull-request code, so
# nothing in it may decide WHERE this job writes. The target pull request is
# resolved from the triggering workflow run instead, and the artifact's own
# number is only compared against that. Otherwise a fork pull request could name
# any pull request in the repository and have this job's write token post
# arbitrary Markdown to it.

on:
  workflow_run:
    workflows:
      - "nf-core linting"
      - "nf-core template version comment"
      - "nf-core branch protection"
      - "Run nf-test"

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  post-comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download PR comment artifact
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: pr-comment
          path: pr-comment
          if_no_artifact_found: ignore

      - name: Read comment metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_FROM_EVENT: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          echo "::group::Downloaded pr-comment contents"
          ls -la pr-comment 2>/dev/null || echo "No pr-comment/ directory was downloaded."
          echo "::endgroup::"

          if [ ! -d pr-comment ]; then
            echo "No pr-comment artifact found; nothing to post."
            exit 0
          fi

          if [ ! -f pr-comment/comment.md ]; then
            echo "Artifact present but no comment.md; nothing to post."
            exit 0
          fi

          # Where to post is decided here, from the triggering run, and never
          # read from the artifact.
          pr_number="${PR_FROM_EVENT}"
          if [ -z "$pr_number" ]; then
            # workflow_run.pull_requests is empty for pull requests from forks,
            # so the head commit has to be looked up instead.
            pr_number=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
              --jq "[.[] | select(.head.sha == \"${HEAD_SHA}\") | .number] | first // empty" || true)
          fi
          if [ -z "$pr_number" ]; then
            # And that endpoint does not always see a fork's head commit either.
            pr_number=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --jq "[.[] | select(.head.sha == \"${HEAD_SHA}\") | .number] | first // empty" || true)
          fi

          case "$pr_number" in
            ''|*[!0-9]*)
              echo "Could not resolve a pull request for head ${HEAD_SHA}; refusing to post."
              exit 1
              ;;
          esac

          # The artifact's own number is now only a cross-check. A mismatch is a
          # producer bug or an attempt to redirect the comment; neither should
          # post.
          if [ -f pr-comment/pr_number.txt ]; then
            claimed=$(tr -dc '0-9' < pr-comment/pr_number.txt | cut -c1-12)
            if [ -n "$claimed" ] && [ "$claimed" != "$pr_number" ]; then
              echo "Artifact claims PR #${claimed} but the triggering run belongs to PR #${pr_number}; refusing to post."
              exit 1
            fi
          fi

          # header is a sticky-comment key, so it is reduced to the characters a
          # key needs. It is written to GITHUB_OUTPUT, where an embedded newline
          # in artifact-supplied text would otherwise set any other output of
          # this step -- including the PR number resolved above.
          header=$(cat pr-comment/header.txt 2>/dev/null | tr -dc 'A-Za-z0-9._-' | cut -c1-64 || true)
          if [ -z "$header" ]; then
            echo "Artifact header is missing or has no usable characters; refusing to post."
            exit 1
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "header=$header" >> "$GITHUB_OUTPUT"
          echo "post=true" >> "$GITHUB_OUTPUT"
          echo "Will post comment to PR #${pr_number} (header='${header}')."

      - name: Post PR comment
        if: steps.meta.outputs.post == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ steps.meta.outputs.pr_number }}
          header: ${{ steps.meta.outputs.header }}
          path: pr-comment/comment.md
