name: Run nf-test CI/CD
# Module and subworkflow tests (modules/local, subworkflows/local) through the
# shared OAMD workflow, against oamd-bio-nf-configs and the DEV ECR images.
# Pipeline tests are in test-pipeline.yml.

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - dev
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      run_on_batch:
        description: "Run tests on AWS Batch"
        required: false
        default: false
        type: boolean
      max_parallel:
        description: "Maximum number of parallel test runs"
        required: false
        default: 2
        type: number
      only_changed:
        description: "Run tests only for changed modules"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nf-test:
    strategy:
      fail-fast: false
      matrix:
        # The manifest minimum (nf-schema 2.7.3 needs >=25.10.0) and the current 26.04 patch
        NXF_VER: ["25.10.0", "26.04.6"]
    uses: cdcent/oamd-bio-gh-actions/.github/workflows/nf-test.yml@main
    with:
      run_on_aws: true
      aws_s3_bucket: ${{ inputs.run_on_batch && 'amdp-dev-bio-development-work' || '' }}
      max_parallel: ${{ inputs.max_parallel || 2 }}
      only_changed: ${{ inputs.only_changed || github.event_name == 'pull_request' }}
      nft_profile: "${{ inputs.run_on_batch && 'dev' || 'standard,dev_reg' }}"
      nf_pipeline_repo: "oamd-bio-qqq"
      nxf_version: ${{ matrix.NXF_VER }}
      # Each version's own default parser (the shared workflow forces v1): 25.10
      # defaults to v1, 26.04 to the strict v2, and qqq runs on both.
      nxf_syntax_parser: ${{ startsWith(matrix.NXF_VER, '25.') && 'v1' || 'v2' }}
    secrets: inherit
