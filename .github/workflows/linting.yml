name: nf-core linting
# Runs the shared OAMD lint workflow: pre-commit, `nf-core pipelines lint`
# (with --release on PRs to main/master) and a report-only `nextflow lint`.

on:
  push:
    branches:
      - dev
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      nf-core_version:
        description: "nf-core/tools version to lint with"
        required: false
        default: "4.1.0"
        type: choice
        options:
          - "3.3.2"
          - "4.1.0"
      lint_options:
        description: "Linting scope"
        required: false
        default: "pipelines"
        type: choice
        options:
          - "all"
          - "pipelines"
          - "modules"
          - "subworkflows"

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  nf-core-lint:
    uses: cdcent/oamd-bio-gh-actions/.github/workflows/lint.yml@main
    with:
      # The tools version the template was built from (.nf-core.yml nf_core_version).
      # The shared default, 3.3.2, lints this 4.x template against a 3.x one and fails
      # checks no 4.x pipeline can pass (it requires validation.help.enabled, which
      # the 4.x template replaced with params.help).
      nf-core_version: ${{ inputs.nf-core_version || '4.1.0' }}
      # Pipeline lint only: the shared "modules" scope lints external modules against
      # cdcent/oamd-bio-ph-core, but qqq's come from amd-ph-core/modules.
      lint_options: ${{ inputs.lint_options || 'pipelines' }}
      # The shared default (25.04.6) is below manifest.nextflowVersion, so the
      # `nextflow config` call inside nf-core lint would refuse to run.
      nxf_version: "26.04.6"
    secrets: inherit
